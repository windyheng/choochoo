# Training/Infra Lead owns this file.

data:
  splits_dir: data/cache/splits
  batch_size: 64
  num_workers: 4

model:
  clip_model: "ViT-B-16"
  clip_pretrained: "openai"   # open_clip pretrained tag
  freeze_clip: true
  srm_out_channels: 32
  fusion_hidden_dim: 256

augmentation:
  # Probability that ANY transform is applied per sample (rest stay clean)
  apply_prob: 0.5
  # Each entry: transform name -> list of severities to sample from.
  # Must match data/transforms.py exactly — see docs/interfaces.md.
  jpeg_quality: [90, 70, 50, 30]
  blur_sigma: [0.5, 1.0, 2.0]
  resize_scale: [0.5, 0.25]
  noise_sigma: [0.02, 0.05, 0.10]
  color_jitter_pct: 0.20
  center_crop_frac: 0.80

train:
  epochs: 10
  lr: 1.0e-3
  weight_decay: 1.0e-4
  checkpoint_dir: checkpoints/
  checkpoint_every_steps: 200
  resume_from_latest: true
  seed: 42

eval:
  threshold: 0.5   # placeholder — Eval lead sets this from FPR/FNR trade-off analysis
